name: WB Intl Login (device auth)

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "等待授权秒数"
        default: "900"
        required: false

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Device auth login
        run: |
          python workbuddy_intl_login.py --no-open --timeout ${{ github.event.inputs.timeout || 900 }}
