name: WB Intl Login (device auth)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare=生成授权链接 / collect=轮询取令牌"
        default: "prepare"
        required: false
      state:
        description: "collect 模式下的 state"
        default: ""
        required: false
      timeout:
        description: "collect 等待秒数"
        default: "1500"
        required: false

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prepare auth link
        if: github.event.inputs.mode == 'prepare'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from workbuddy_intl_login import start_login
          d = start_login()
          print()
          print('=' * 60)
          print('STATE: ' + d['state'])
          print('AUTH_URL: ' + d['authUrl'])
          print('=' * 60)
          PY
      - name: Collect token
        if: github.event.inputs.mode == 'collect'
        env:
          WB_STATE: ${{ github.event.inputs.state }}
          WB_TIMEOUT: ${{ github.event.inputs.timeout }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          from workbuddy_intl_login import poll_token, _uid_of
          state = os.environ['WB_STATE']
          auth = poll_token(state, int(os.environ.get('WB_TIMEOUT', '1500')))
          at = auth['accessToken']; rt = auth.get('refreshToken') or ''
          uid = _uid_of(at)
          line = '账号1|' + at + '|' + uid + '|' + rt
          with open('wb_intl_entry.txt', 'w', encoding='utf-8') as f:
              f.write(line + '\n')
          print('WB_INTL_ENTRY saved to artifact, uid =', uid)
          PY
      - name: Upload token artifact
        if: github.event.inputs.mode == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: wb-intl-entry
          path: wb_intl_entry.txt
          retention-days: 1
